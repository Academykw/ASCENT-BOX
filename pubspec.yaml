name: ascent
description: A beautiful offline motivational app to uplift your day.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  confetti: ^0.7.0
  audioplayers: ^6.0.0
  lottie: ^3.1.0
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  android: "ic_launcher"


flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png
